<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 270" width="1010" height="270" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img"><title>Rows read to give one answer about Rabat: AS OF reads 1,845, 1,385 and 60 rows; the first-row query reads 1 every time</title>
